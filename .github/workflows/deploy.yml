name: Deploy Certificate Studio AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want deployment to finish safely.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle (dist)
        env:
          VITE_BASE_PATH: '/certificate/'
        run: npm run build

      - name: Verify production build output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; exit 1; }
          test -f dist/assets/app.js || { echo "ERROR: dist/assets/app.js not found"; exit 1; }
          test -f dist/assets/index.css || { echo "ERROR: dist/assets/index.css not found"; exit 1; }
          echo "Verified: dist/index.html, dist/assets/app.js, and dist/assets/index.css exist."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
