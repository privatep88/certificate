name: Deploy Certificate Studio AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle (dist)
        env:
          VITE_BASE_PATH: '/certificate/'
        run: npm run build

      - name: Copy index.html to 404.html for SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Ensure .nojekyll exists in dist
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Ensure automatic branch pages-build-deployment does not overwrite dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 24); do
            RUN_IDS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA" | \
              node -e '
                try {
                  const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
                  const ids = (d.workflow_runs || [])
                    .filter(r => r.path === "dynamic/pages/pages-build-deployment" && r.status !== "completed")
                    .map(r => r.id);
                  console.log(ids.join(" "));
                } catch { console.log(""); }
              ')
            if [ -z "$RUN_IDS" ]; then
              echo "No active branch pages-build-deployment runs found."
              break
            fi
            for id in $RUN_IDS; do
              echo "Waiting for / cancelling branch pages-build-deployment run $id..."
              curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true
            done
            sleep 5
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
